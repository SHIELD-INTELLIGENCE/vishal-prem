[build]
  command = "npm ci && npm --prefix functions ci && npm run build && npm run functions:build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Trusted order, payment and stock operations. These functions use the Firebase
# Admin SDK and are bundled at deploy time; they must never be placed under the
# publish directory.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA history fallback. Netlify Functions and static assets are matched before
# this catch-all. This makes deep links such as `/` and `/admin/orders/:id`
# resolve on refresh. All trusted writes use same-origin Netlify Functions.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://*.firebasestorage.app https://*.cloudfunctions.net https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:"
